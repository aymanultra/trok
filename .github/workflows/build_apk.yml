name: Build Trok APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Missing Gradle Wrapper & Native Android Files
        run: |
          echo "Backing up custom Trok code and assets..."
          mkdir -p /tmp/trok_backup
          cp -r lib /tmp/trok_backup/
          cp pubspec.yaml /tmp/trok_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/trok_backup/
          cp -r android/app/src/main/res /tmp/trok_backup/
          cp android/app/build.gradle /tmp/trok_backup/

          echo "Running flutter create to generate complete gradlew and Android wrappers..."
          flutter create . --project-name trok --org com.trok.mediamanager --platforms=android

          echo "Restoring custom Trok source code, manifest, build.gradle, and icons..."
          rm -rf lib/*
          cp -r /tmp/trok_backup/lib/* lib/
          cp /tmp/trok_backup/pubspec.yaml pubspec.yaml
          cp /tmp/trok_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/trok_backup/res/* android/app/src/main/res/
          cp /tmp/trok_backup/build.gradle android/app/build.gradle

          echo "Setting permissions for Gradle wrapper..."
          chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Final Trok APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ./Trok.apk
          ls -lh Trok.apk

      - name: Upload Trok APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trok-APK
          path: Trok.apk
          if-no-files-found: error
