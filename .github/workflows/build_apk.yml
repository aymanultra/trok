name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Missing Gradle Wrapper & Native Android Files
        run: |
          echo "Locating project files..."
          if [ ! -d "lib" ]; then
            FOUND_LIB=$(find . -maxdepth 3 -type d -name "lib" | head -n 1)
            if [ -n "$FOUND_LIB" ]; then
              PROJ_DIR=$(dirname "$FOUND_LIB")
              echo "Moving files from $PROJ_DIR to root..."
              cp -rn "$PROJ_DIR"/* . 2>/dev/null || true
            else
              echo "ERROR: You have not uploaded the 'lib' folder and project files to GitHub yet!"
              exit 1
            fi
          fi

          mkdir -p /tmp/trok_backup/res
          cp -r lib /tmp/trok_backup/
          cp pubspec.yaml /tmp/trok_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/trok_backup/ 2>/dev/null || true
          cp -r android/app/src/main/res/mipmap-* /tmp/trok_backup/res/ 2>/dev/null || true
          cp android/app/src/main/res/values/styles.xml /tmp/trok_backup/ 2>/dev/null || true

          flutter create . --project-name trok --org com.trok.mediamanager --platforms=android

          cp -r /tmp/trok_backup/lib/* lib/
          cp /tmp/trok_backup/pubspec.yaml pubspec.yaml
          [ -f /tmp/trok_backup/AndroidManifest.xml ] && cp /tmp/trok_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/trok_backup/res/mipmap-* android/app/src/main/res/ 2>/dev/null || true
          [ -f /tmp/trok_backup/styles.xml ] && cp /tmp/trok_backup/styles.xml android/app/src/main/res/values/styles.xml

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 28/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 28/g' android/app/build.gradle 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Final Trok APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Trok.apk

      - name: Upload Trok APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trok-APK
          path: Trok.apk
