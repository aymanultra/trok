name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold & Fix Android Manifest for All Devices
        run: |
          if [ ! -d "lib" ]; then
            FOUND_LIB=$(find . -maxdepth 3 -type d -name "lib" | head -n 1)
            if [ -n "$FOUND_LIB" ]; then
              PROJ_DIR=$(dirname "$FOUND_LIB")
              cp -rn "$PROJ_DIR"/* . 2>/dev/null || true
            fi
          fi

          mkdir -p /tmp/trok_backup/res
          cp -r lib /tmp/trok_backup/
          cp pubspec.yaml /tmp/trok_backup/
          cp -r android/app/src/main/res/mipmap-* /tmp/trok_backup/res/ 2>/dev/null || true

          # Remove manual android folder to generate a 100% valid Flutter Android structure
          rm -rf android

          flutter create . --project-name trok --org com.trok.mediamanager --platforms=android

          cp -r /tmp/trok_backup/lib/* lib/
          cp /tmp/trok_backup/pubspec.yaml pubspec.yaml
          cp -r /tmp/trok_backup/res/mipmap-* android/app/src/main/res/ 2>/dev/null || true

          # Write a clean, 100% valid AndroidManifest.xml with android:exported="true"
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage"/>

              <application
                  android:label="Trok"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # Support Android 6.0+ (API 23) to Android 15+ so it parses on any phone
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$f"
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$f"
              sed -i 's/minSdkVersion(flutter.minSdkVersion)/minSdkVersion(23)/g' "$f"
            fi
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Final Trok APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Trok.apk

      - name: Upload Trok APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trok-APK
          path: Trok.apk
